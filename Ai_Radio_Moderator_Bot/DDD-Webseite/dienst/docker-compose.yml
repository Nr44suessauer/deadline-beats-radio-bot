services:
  ddd-radio:
    build: .
    image: ddd-radio:latest
    container_name: ddd-radio
    restart: unless-stopped
    ports:
      - "8882:8881"
    volumes:
      - ./voices:/voices
      - ./daten:/daten
    env_file:
      - ./geheim.env
    environment:
      VOICE_DIR: /voices
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-aqua}
      AQUA_TTS_URL: ${AQUA_TTS_URL:-http://192.168.178.116:10205/tts}
      AQUA_ERSATZ: ${AQUA_ERSATZ:-de_thorsten}
      RECHERCHE_SEARX_URL: ${RECHERCHE_SEARX_URL:-http://192.168.178.26:8888}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8881/health').status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
