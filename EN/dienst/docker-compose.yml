services:
  radio-tts:
    build: .
    image: radio-tts:latest
    container_name: radio-tts
    restart: unless-stopped
    ports:
      - "8881:8881"
    volumes:
      # Own voices: <name>.onnx + <name>.onnx.json place here
      - ./voices:/voices
      # Catalog of the music archive (fuzzy search, suggestions)
      - ./data:/data
    env_file:
      - ./geheim.env
    environment:
      VOICE_DIR: /voices
      # Own moderation voice: “deine-stimme” is generated by the voice service on the
      # GPU machine (edge-tts + RVC, CT 111 Port 10205; setup:
      # docs/projects/Ai_Radio_Moderator_Bot/Sender-1-Deadline-Beats/DOKU/STIMME.md). If it is not
      # reachable, the service continues speaking with EIGENE_STIMME_ERSATZ. Piper voices
      # remain selectable via the voice/voice field (de_thorsten, de_kerstin ...).
      # Standard voice: since 2026-09-25 de_thorsten (Piper, always running).
      # The your voice will only be used upon explicit request
      # (“... with your voice” -> voice=deine-stimme in the announcement request).
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-de_thorsten}
      EIGENE_STIMME_URL: ${EIGENE_STIMME_URL:-http://192.168.178.116:10205/tts}
      EIGENE_STIMME_ERSATZ: ${EIGENE_STIMME_ERSATZ:-de_thorsten}
      # Own search engine for topic overview (LXC 108, SearXNG).
      # Leave empty = fallback to DuckDuckGo/Bing.
      RECHERCHE_SEARX_URL: ${RECHERCHE_SEARX_URL:-http://192.168.178.26:8888}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8881/health').status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
